[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
# The Claude hooks are installed under these names, without an extension.
extend-include = ["claude/hooks/herdr-tab", "claude/hooks/herdr-orchestrator"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
